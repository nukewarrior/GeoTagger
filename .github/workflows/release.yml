name: Signed macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN_VERSION: "1.97.1"
  CARGO_INCREMENTAL: "0"
  PROJ_NETWORK: "OFF"

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Validate tag and project versions
        shell: bash
        run: bash .github/scripts/validate-release.sh "${GITHUB_REF_NAME}"

      - name: Export release version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

  macos:
    name: Sign and notarize macOS arm64
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    timeout-minutes: 120
    environment:
      name: macos-signing
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed when macOS signing secrets are incomplete
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -Eeuo pipefail
          for variable_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_PRIVATE_KEY_BASE64
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Required macOS release secret is missing: ${variable_name}" >&2
              exit 1
            fi
          done
          [[ "${APPLE_SIGNING_IDENTITY}" == "Developer ID Application:"* ]]

      - name: Set up Node.js with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up pinned Rust target
        shell: bash
        run: bash .github/scripts/setup-rust.sh aarch64-apple-darwin

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-aarch64-apple-darwin-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install exactly locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare and verify ExifTool
        shell: bash
        run: |
          set -Eeuo pipefail
          bash .github/scripts/prepare-exiftool.sh \
            "${GITHUB_WORKSPACE}/src-tauri/resources/exiftool" \
            "${RUNNER_TEMP}/geotagger-exiftool-fixture.jpg"
          bash .github/scripts/verify-exiftool.sh \
            "${GITHUB_WORKSPACE}/src-tauri/resources/exiftool" \
            "${RUNNER_TEMP}/geotagger-exiftool-fixture.jpg"

      - name: Run frontend release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm test
          npm run build:web

      - name: Run Rust release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd src-tauri
            cargo fmt --all -- --check
          )
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features

      - name: Build release executable before exposing signing credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run tauri -- build \
            --no-bundle \
            --target aarch64-apple-darwin \
            --config .github/tauri.ci.conf.json \
            -- \
            --locked

      - name: Sign, notarize, staple, and collect release bundles
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -Eeuo pipefail
          bash .github/scripts/release-macos.sh \
            release-assets \
            aarch64-apple-darwin \
            "${{ needs.validate.outputs.version }}" \
            .github/tauri.ci.conf.json

      - name: Upload signed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ needs.validate.outputs.version }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true

  attest:
    name: Attest signed release artifacts
    needs:
      - validate
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download signed release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-${{ needs.validate.outputs.version }}
          path: release-assets

      - name: Generate build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/*

  publish:
    name: Publish GitHub release
    needs:
      - validate
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download signed release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-${{ needs.validate.outputs.version }}
          path: release-assets

      - name: Verify release checksums
        shell: bash
        run: bash .github/scripts/verify-checksums.sh release-assets

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -Eeuo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* \
              --repo "${GH_REPO}" \
              --clobber
          else
            release_flags=()
            if [[ "${RELEASE_VERSION}" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" release-assets/* \
              --repo "${GH_REPO}" \
              --verify-tag \
              --generate-notes \
              --title "GeoTagger ${RELEASE_VERSION}" \
              "${release_flags[@]}"
          fi
